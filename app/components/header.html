<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avan.Market</title>
  <link rel="stylesheet" href="libs/slick/slick.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <button class="burger" id="burger">
            <img class="burger__img" src="images/icons/burger.svg" alt="menu">
          </button>
          <a class="logo" href="#!">
            <img class="logo__img" src="images/logo.svg" alt="logo">
          </a>
          <nav class="nav" id="nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a class="nav__link active" href="#!">Главная</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#!">Партнерка</a>
              </li>
              <li class="nav__item">
                <a class="nav__link button" href="#!">Блог
                  <img class="nav__link-arrow" src="images/icons/arrow.svg" alt="arrow">
                </a>
                <ul class="nav__dropdown">
                  <li class="nav__dropdown-item">
                    <a class="nav__dropdown-link" href="#!">CS2</a>
                  </li>
                  <li class="nav__dropdown-item">
                    <a class="nav__dropdown-link" href="#!">Dota 2</a>
                  </li>
                  <li class="nav__dropdown-item">
                    <a class="nav__dropdown-link" href="#!">RUST</a>
                  </li>
                  <li class="nav__dropdown-item">
                    <a class="nav__dropdown-link" href="#!">TF2</a>
                  </li>
                </ul>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#!">Отзывы</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#!">Помощь</a>
              </li>
            </ul>
            <div class="select">
              <div class="currency">
                <button class="currency__title button">
                  <span class="currency__symbol">$</span>
                  <span class="currency__text">USD</span>
                </button>
                <ul class="currency__list">
                  <li class="currency__item">
                    <a class="currency__link target" href="#!">$ USD</a>
                  </li>
                  <li class="currency__item">
                    <a class="currency__link" href="#!">₽ RUB</a>
                  </li>
                  <li class="currency__item">
                    <a class="currency__link" href="#!">₴ UAH</a>
                  </li>
                  <li class="currency__item">
                    <a class="currency__link" href="#!">Br BYN</a>
                  </li>
                  <li class="currency__item">
                    <a class="currency__link" href="#!">₸ KZT</a>
                  </li>
                  <li class="currency__item">
                    <a class="currency__link" href="#!">€ EUR</a>
                  </li>
                </ul>
              </div>
              <div class="language">
                <button class="language__title button">
                  <img class="language__img" src="images/icons/web.svg" alt="web">
                  <span class="language__text">RUS</span>
                </button>
                <ul class="language__list">
                  <li class="language__item">
                    <a class="language__link target" href="#!">RUS</a>
                  </li>
                  <li class="language__item">
                    <a class="language__link" href="#!">ENG</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
          <a class="header__btn btn"
            href="https://steamcommunity.com/openid/login?openid.mode=checkid_setup&openid.ns=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0&openid.ns.sreg=http%3A%2F%2Fopenid.net%2Fextensions%2Fsreg%2F1.1&openid.sreg.optional=nickname%2Cemail%2Cfullname%2Cdob%2Cgender%2Cpostcode%2Ccountry%2Clanguage%2Ctimezone&openid.ns.ax=http%3A%2F%2Fopenid.net%2Fsrv%2Fax%2F1.0&openid.ax.mode=fetch_request&openid.ax.type.fullname=http%3A%2F%2Faxschema.org%2FnamePerson&openid.ax.type.firstname=http%3A%2F%2Faxschema.org%2FnamePerson%2Ffirst&openid.ax.type.lastname=http%3A%2F%2Faxschema.org%2FnamePerson%2Flast&openid.ax.type.email=http%3A%2F%2Faxschema.org%2Fcontact%2Femail&openid.ax.required=fullname%2Cfirstname%2Clastname%2Cemail&openid.identity=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&openid.claimed_id=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&openid.return_to=https%3A%2F%2Favan.market%2Fapi%2Fauth%2Fsteam%2Fcallback&openid.realm=https%3A%2F%2Favan.market%2Fapi"
            target="_blank">
            <img class="header__btn-img" src="images/icons/steam-logo.svg" alt="steam">
            <span class="header__btn-text">Войти через Steam</span>
            <span class="header__btn-text--mobile">Войти</span>
          </a>
        </div>
      </div>
    </header>
